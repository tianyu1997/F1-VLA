dataset:
  # Use ME_KVM data format - loop trajectory data for Memory validation
  use_mekvm_format: True
  mekvm_data_dirs:
    - /mnt/data2/ty/F1-VLA/RoboTwin/data/loop_trajectory

  mekvm_task_descriptions:
    - "机械臂在两点间往返运动,根据历史轨迹和当前动作预测下一帧观测。"
    
  mekvm_weights:
    - 1.0

  # Test dataset for evaluation
  mekvm_test_data_dir: /mnt/data2/ty/F1-VLA/RoboTwin/data/loop_trajectory_test
    
  n_obs_img_steps: 4
  n_pred_img_steps: 1
  chunk_size: 4

  # Legacy LeRobot config (not used when use_mekvm_format=True)
  train_dir: {}

  image_size:
    height: 224
    width: 224
  world_model_suffix: history
  transforms:
    consistent_random_crop_stages: []

exp:
  stage: stage1_pretrain_wm
  # Load from F1_pretrain (same starting point as memory version)
  load_ckpt: /mnt/data2/ty/F1-VLA/outputs/no_memory_wrist_only/checkpoint-episode-800
  
  # Memory configuration - DISABLED for control group
  use_memory: False

  # VAE training configuration
  vae_config:
    test_mode: True           # Completely freeze VAE (encoder + decoder)
    freeze_encoder: True      # Freeze encoder
    pixel_loss_weight: 0.0    # Disabled - VAE fully frozen
    pixel_loss_type: mse      # 'mse' or 'l1'
    dropout: 0.0              # No dropout

  training_args:
    output_dir: outputs/no_memory_wrist_only
    run_name: no_memory_wrist_only
    do_train: True
    do_eval: False
    num_train_epochs: 500
    per_device_train_batch_size: 8
    per_device_eval_batch_size: 8
    gradient_accumulation_steps: 1
    gradient_checkpointing: False

    optim: adamw_bnb_8bit

    learning_rate: !!float 1e-5
    weight_decay: !!float 1e-4
    max_grad_norm: 1.0
    adam_beta1: 0.9
    adam_beta2: 0.999
    adam_epsilon: !!float 1e-8
    lr_scheduler_type: cosine

    max_steps: 10000
    warmup_steps: 100
    log_level: info
    log_level_replica: error

    seed: 42
    bf16: True
    save_safetensors: True
    disable_tqdm: True

    save_total_limit: 5
    overwrite_output_dir: True
    dataloader_num_workers: 4
    dataloader_pin_memory: False
    dataloader_persistent_workers: False
    dataloader_prefetch_factor: 2
    remove_unused_columns: False

    # Episode-based intervals (custom EpisodeProgressCallback)
    logging_episodes: 10   # Log every 100 episodes
    save_episodes: 30     # Save checkpoint every 200 episodes
    eval_episodes: 10      # Eval every 100 episodes (if enabled)
    
    # HF Trainer fallback settings (disable step-based saving, only use episode-based)
    logging_strategy: "steps"
    logging_steps: 9999999999
    save_strategy: "steps"
    save_steps: 9999999999
    eval_strategy: "no"

    label_names: 
      - action
    report_to: 
      - tensorboard

    torch_compile: False
    stage: stage1_pretrain_wm

    # World Model Training Only
    gen_out_loss_ratio: 1.0
    freeze_vision_encoder: True
    freeze_gen_expert: False
    train_act_expert_only: False
    train_gen_expert_only: True
    train_state_proj: False
    freeze_paligemma: True

    image_transforms_enabled: False
    image_transforms_type: []
    image_transforms_max_num_transforms: 0
    image_transforms_random_order: True

    und_expert_lr: !!float 0
    act_expert_lr: !!float 0
    vision_encoder_lr: !!float 0
    gen_expert_lr: !!float 5e-5

  max_eval_samples: 200
  
  camera_config:
    und_camera_keys:
      - wrist_rgb
    wm_camera_key: wrist_rgb

policy:
  model_name: f1
  path: /mnt/data2/ty/F1-VLA/F1_pretrain/pi0
  ckpt_path: f1_vla/config/f1_config.json
  language_tokenizer_path: /mnt/data2/ty/F1-VLA/F1_pretrain/paligemma-3b-pt-224
  mwm_pretrained_path: null
  chunk_size: 4

  use_world_model: True
  pn: "1_2_3_4_5_6_8_10_13_16"
  vae_ckpt: /mnt/data2/ty/F1-VLA/var/vae_ch160v4096z32.pth

  temporal_conv_kernel_size: 4
  temporal_conv_stride: 4
  vocab_size: 4096
  vae_dim: 32
  num_resolutions: 9  # Only compute first 9 layers (skip 16x16 layer)

  resize_imgs_with_padding: "(224, 224)"
  attention_implementation: flash_attention_2
