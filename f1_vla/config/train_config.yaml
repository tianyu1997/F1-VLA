dataset:
  # Use ME_KVM data format
  use_mekvm_format: True
  mekvm_data_dirs:
    - /mnt/data2/ty/F1-VLA/ME_KVM_VLA/data/clean
  mekvm_task_descriptions:
    - "manipulate objects in clean environment"
  mekvm_weights:
    - 1.0
  n_obs_img_steps: 4
  n_pred_img_steps: 1
  chunk_size: 4

  # Legacy LeRobot config (not used when use_mekvm_format=True)
  train_dir:
    # ========== libero ==========
    libero_spatial_no_noops:
      path: /mnt/data2/ty/F1-VLA/libero_spatial_no_noops_1.0.0_lerobot
      camera_keys: 
        - observation.images.image
        - observation.images.wrist_image
      state_keys: 
        - observation.state
      action_keys:
        - action
      predict_img_keys:
        - observation.images.image
      type: libero
      weight: 5
      n_obs_img_steps: 4
      n_pred_img_steps: 1
      obs_img_stride: 1
      num_indices: 20
      norm_method: mean_std

  image_size:
    height: 224
    width: 224
  world_model_suffix: history
  transforms:
    consistent_random_crop_stages:
      - stage1_pretrain_wm
      - stage2_pretrain_vla
      - stage3_finetune_vla

exp:
  stage: stage1_pretrain_wm
  load_ckpt: /mnt/data2/ty/F1-VLA/wm
  
  # Memory configuration
  use_memory: False  # Memory switch: set to True to enable memory mechanism
  memory_config:
    memory_len: 4      # Number of memory slots per layer
    bptt_steps: 8      # BPTT truncation length for gradient
    tokenizer_max_length: 512  # Extended tokenizer length for history text

  training_args:
    output_dir: outputs/debug_test
    run_name: debug_test
    do_train: True
    do_eval: False
    num_train_epochs: 5
    num_eval_episodes: 2000
    per_device_train_batch_size: 2
    per_device_eval_batch_size: 1

    learning_rate: !!float 5e-5
    weight_decay: !!float 1e-10
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_epsilon: !!float 1e-8
    lr_scheduler_type: cosine
    gradient_accumulation_steps: 1

    max_steps: 1000
    warmup_steps: 100
    log_level: info
    log_level_replica: error

    seed: 42
    bf16: True
    logging_strategy: steps
    logging_steps: 50
    save_strategy: steps
    save_steps: 500
    eval_strategy: "no"
    eval_steps: 500
    eval_accumulation_steps: 1
    save_safetensors: True
    include_for_metrics: 
      - loss

    save_total_limit: 5
    overwrite_output_dir: True
    dataloader_num_workers: 4
    dataloader_pin_memory: False
    dataloader_persistent_workers: True
    dataloader_prefetch_factor: 4
    remove_unused_columns: False
    resume_from_checkpoint: null

    label_names: 
      - action
    metric_for_best_model: "eval_loss"
    greater_is_better: True

    report_to: 
      - tensorboard

    torch_compile: True
    stage: stage1_pretrain_wm

    gen_out_loss_ratio: 0.1
    freeze_vision_encoder: True
    freeze_gen_expert: False
    train_act_expert_only: False
    train_gen_expert_only: True
    train_state_proj: True

    image_transforms_enabled: True
    image_transforms_type:
      - brightness
      - contrast
      - saturation
      - random_crop
      - random_rotation
    image_transforms_max_num_transforms: 3
    image_transforms_random_order: True

    und_expert_lr: !!float 5e-5
    act_expert_lr: !!float 5e-5
    vision_encoder_lr: !!float 2.5e-5
    gen_expert_lr: !!float 5e-5

  max_eval_samples: 5000

policy:
  model_name: f1
  path: /mnt/data2/ty/F1-VLA/pi0
  ckpt_path: f1_vla/config/f1_config.json
  language_tokenizer_path: /mnt/data2/ty/F1-VLA/paligemma-3b-pt-224
  mwm_pretrained_path: null
  chunk_size: 4

  use_world_model: True
  pn: "1_2_3_4_5_6_8_10_13_16"
  vae_ckpt: /mnt/data2/ty/F1-VLA/var/vae_ch160v4096z32.pth

  temporal_conv_kernel_size: 4
  temporal_conv_stride: 4
  vocab_size: 4096
  vae_dim: 32
  num_resolutions: 4

  resize_imgs_with_padding: "(224, 224)"
  attention_implementation: eager
