dataset:
  # Use ME_KVM data format - clean data only
  use_mekvm_format: True
  mekvm_data_dirs:
    - /mnt/data2/ty/F1-VLA/ME_KVM_VLA/data/clean

  mekvm_task_descriptions:
    - "在干净环境中,探索环境,根据动作和状态预测下一帧观测。"
    
  mekvm_weights:
    - 1.0  # 100% clean data
    
  n_obs_img_steps: 4
  n_pred_img_steps: 1
  chunk_size: 4

  # Legacy LeRobot config (not used when use_mekvm_format=True)
  train_dir: {}

  image_size:
    height: 224
    width: 224
  world_model_suffix: history
  transforms:
    consistent_random_crop_stages:
      - stage1_pretrain_wm

exp:
  stage: stage1_pretrain_wm
  # Load from F1_pretrain (not checkpoint resume, fresh memory training)
  load_ckpt: /mnt/data2/ty/F1-VLA/F1_pretrain
  
  # Memory configuration - ENABLED (fresh training from F1_pretrain)
  use_memory: True
  memory_config:
    memory_len: 32     # Number of memory slots per layer (balanced speed/capacity)
    bptt_steps: 4       # BPTT truncation length (4 for faster training)
    init_std: 0.02      # Memory parameter initialization std
    tokenizer_max_length: 512

  # VAE training configuration
  vae_config:
    test_mode: True           # Completely freeze VAE (encoder + decoder)
    freeze_encoder: True      # Freeze encoder
    pixel_loss_weight: 0.0    # Disabled - VAE fully frozen
    pixel_loss_type: mse      # 'mse' or 'l1'
    dropout: 0.0              # No dropout

  training_args:
    output_dir: outputs/memory_from_f1pretrain
    run_name: memory_from_f1pretrain_v1
    # Fresh training - no resume
    resume_from_checkpoint: null
    do_train: True
    do_eval: False
    num_train_epochs: 1000  # Set very high, max_steps controls actual training
    per_device_train_batch_size: 1  # Reduced for memory with KVMemoryBank
    per_device_eval_batch_size: 1
    gradient_accumulation_steps: 8  # 8 for faster training (fewer weight updates per epoch)

    # Use standard AdamW optimizer (avoid 8bit for memory training stability)
    optim: adamw_bnb_8bit

    learning_rate: !!float 3e-5  # Slightly higher for fresh training
    weight_decay: !!float 1e-4   # Standard regularization
    max_grad_norm: 1.0           # Gradient clipping
    adam_beta1: 0.9
    adam_beta2: 0.999
    adam_epsilon: !!float 1e-8
    lr_scheduler_type: cosine

    max_steps: 360000
    warmup_steps: 3000           # Longer warmup for fresh memory training
    log_level: info
    log_level_replica: error

    seed: 42
    bf16: True
    # Disable step-based logging/saving (use episode-based instead)
    logging_strategy: "no"
    logging_steps: 999999
    save_strategy: "no"
    save_steps: 999999
    eval_strategy: "no"
    save_safetensors: True
    disable_tqdm: True

    save_total_limit: 5
    overwrite_output_dir: True
    dataloader_num_workers: 8
    dataloader_pin_memory: False
    dataloader_persistent_workers: True
    dataloader_prefetch_factor: 8
    remove_unused_columns: False

    # Episode-based logging/saving/eval
    logging_episodes: 50
    save_episodes: 240  # 每个epoch保存一次，释放显存
    eval_episodes: 100

    label_names: 
      - action
    report_to: 
      - tensorboard

    torch_compile: False
    stage: stage1_pretrain_wm

    # World Model + PaliGemma Training (Action Expert frozen)
    gen_out_loss_ratio: 1.0
    freeze_vision_encoder: False
    freeze_gen_expert: False
    train_act_expert_only: False
    train_gen_expert_only: True
    train_state_proj: True

    image_transforms_enabled: True
    image_transforms_type:
      - brightness
      - contrast
      - saturation
      - random_crop
    image_transforms_max_num_transforms: 3
    image_transforms_random_order: True

    und_expert_lr: !!float 1e-5
    act_expert_lr: !!float 0
    vision_encoder_lr: !!float 2e-6
    gen_expert_lr: !!float 5e-5

  max_eval_samples: 1000
  
  camera_config:
    und_camera_keys:
      - head_rgb
      - wrist_rgb
    wm_camera_key: wrist_rgb

policy:
  model_name: f1
  path: /mnt/data2/ty/F1-VLA/pi0
  ckpt_path: f1_vla/config/f1_config.json
  language_tokenizer_path: /mnt/data2/ty/F1-VLA/paligemma-3b-pt-224
  mwm_pretrained_path: null
  chunk_size: 4

  use_world_model: True
  pn: "1_2_3_4_5_6_8_10_13_16"
  vae_ckpt: /mnt/data2/ty/F1-VLA/var/vae_ch160v4096z32.pth

  # Episode-internal loss warmup: DISABLED for better memory initialization
  loss_warmup_frames: 0       # DISABLED - all frames train equally
  loss_warmup_min_weight: 1.0 # All frames have full weight

  temporal_conv_kernel_size: 4
  temporal_conv_stride: 4
  vocab_size: 4096
  vae_dim: 32
  num_resolutions: 10

  resize_imgs_with_padding: "(224, 224)"
  attention_implementation: eager
