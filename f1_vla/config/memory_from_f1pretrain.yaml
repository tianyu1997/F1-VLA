dataset:
  # Use ME_KVM data format - clean data only
  use_mekvm_format: True
  mekvm_data_dirs:
    - /mnt/data2/ty/F1-VLA/data/clean_teacher_offline/part_gpu0
    - /mnt/data2/ty/F1-VLA/data/clean_teacher_offline/part_gpu1
    - /mnt/data2/ty/F1-VLA/data/clean_teacher_offline/part_gpu2
    - /mnt/data2/ty/F1-VLA/data/clean_teacher_offline/part_gpu3

  mekvm_task_descriptions:
    - "在干净环境中,探索环境,根据动作和状态预测下一帧观测。"
    - "在干净环境中,探索环境,根据动作和状态预测下一帧观测。"
    - "在干净环境中,探索环境,根据动作和状态预测下一帧观测。"
    - "在干净环境中,探索环境,根据动作和状态预测下一帧观测。"
    
  mekvm_weights:
    - 0.25
    - 0.25
    - 0.25
    - 0.25
    
  n_obs_img_steps: 4
  n_pred_img_steps: 1
  chunk_size: 4

  # Legacy LeRobot config (not used when use_mekvm_format=True)
  train_dir: {}

  image_size:
    height: 224
    width: 224
  world_model_suffix: history
  transforms:
    consistent_random_crop_stages: []
      # - stage1_pretrain_wm

exp:
  stage: stage1_pretrain_wm
  # Load from specific memory pretraining checkpoint
  load_ckpt: /mnt/data2/ty/F1-VLA/F1_pretrain/model.safetensors
  
  # Memory configuration - ENABLED (fresh training from F1_pretrain)
  use_memory: True
  memory_config:
    memory_len: 64    # Number of memory slots per layer (balanced speed/capacity)
    bptt_steps: 8       # BPTT truncation length (INCREASED from 4->8 for better gradient flow)    
    k_bptt: 6        # Truncated BPTT: only keep gradients for last k steps (reduces memory)    
    init_std: 0.02      # Memory parameter initialization std
    tokenizer_max_length: 512

  # VAE training configuration
  vae_config:
    test_mode: True           # Completely freeze VAE (encoder + decoder)
    freeze_encoder: True      # Freeze encoder
    pixel_loss_weight: 0.0    # Disabled - VAE fully frozen
    pixel_loss_type: mse      # 'mse' or 'l1'
    dropout: 0.0              # No dropout

  training_args:
    output_dir: outputs/memory_from_f1pretrain_v3
    run_name: memory_from_f1pretrain_v3
    # Resume from specific checkpoint
    # resume_from_checkpoint: null
    do_train: True
    do_eval: False
    num_train_epochs: 500   # Increased to ensure training reaches max_steps
    per_device_train_batch_size: 1  # Reduced to 1 due to OOM
    per_device_eval_batch_size: 1
    gradient_accumulation_steps: 8  # Increased to 8 to keep Global Batch Size = 32 (1 * 8 * 4)
    gradient_checkpointing: True    # Enable Gradient Checkpointing

    # Use standard AdamW optimizer (avoid 8bit for memory training stability)
    optim: adamw_bnb_8bit

    learning_rate: !!float 1e-5  # REDUCED from 3e-5 to 1e-5 for more stable training
    weight_decay: !!float 1e-4   # Standard regularization
    max_grad_norm: 1.0           # Gradient clipping
    adam_beta1: 0.9
    adam_beta2: 0.999
    adam_epsilon: !!float 1e-8
    lr_scheduler_type: cosine

    max_steps: 20000             # Fine-tune for additional 20k steps
    warmup_steps: 1000           # Short warmup for fine-tuning
    log_level: info
    log_level_replica: error

    seed: 42
    bf16: True
    # Disable step-based logging/saving (use episode-based instead)
    logging_strategy: "no"
    logging_steps: 999999
    save_strategy: "no"
    save_steps: 999999
    eval_strategy: "no"
    save_safetensors: True
    disable_tqdm: True

    save_total_limit: 5
    overwrite_output_dir: True
    dataloader_num_workers: 8
    dataloader_pin_memory: False
    dataloader_persistent_workers: True
    dataloader_prefetch_factor: 8
    remove_unused_columns: False

    # Episode-based logging/saving/eval
    logging_episodes: 50
    save_episodes: 512  # 每个epoch保存一次，释放显存
    eval_episodes: 20

    label_names: 
      - action
    report_to: 
      - tensorboard

    torch_compile: False
    stage: stage1_pretrain_wm

    # World Model Training Only - 只训练World Model Expert和Memory模块
    # 其他所有模块都被冻结
    gen_out_loss_ratio: 1.0
    freeze_vision_encoder: True   # 冻结Vision Encoder
    freeze_gen_expert: False      # World Model Expert可训练
    train_act_expert_only: False  # 不只训练Action Expert
    train_gen_expert_only: True   # 只训练Gen Expert(会自动冻结state_proj等)
    train_state_proj: False       # 被train_gen_expert_only覆盖,显式设为False
    freeze_paligemma: True        # 冻结整个PaliGemma(优先级最高)

    image_transforms_enabled: False
    image_transforms_type: []
    image_transforms_max_num_transforms: 0
    image_transforms_random_order: True

    # PaliGemma已冻结(freeze_paligemma=True)，这些学习率不会生效
    und_expert_lr: !!float 0        # PaliGemma Language Model - 已冻结
    act_expert_lr: !!float 0         # Action Expert - 已冻结 (train_gen_expert_only=True)
    vision_encoder_lr: !!float 0     # Vision Encoder - 已冻结
    gen_expert_lr: !!float 5e-5      # World Model Expert - 唯一训练的部分

  max_eval_samples: 1000
  
  camera_config:
    und_camera_keys:
      - head_rgb
      - wrist_rgb
    wm_camera_key: wrist_rgb

policy:
  model_name: f1
  path: /mnt/data2/ty/F1-VLA/pi0
  ckpt_path: f1_vla/config/f1_config.json
  language_tokenizer_path: /mnt/data2/ty/F1-VLA/paligemma-3b-pt-224
  mwm_pretrained_path: null
  chunk_size: 4

  use_world_model: True
  pn: "1_2_3_4_5_6_8_10_13_16"
  vae_ckpt: /mnt/data2/ty/F1-VLA/var/vae_ch160v4096z32.pth

  # Loss warmup已移除 - 所有帧平等训练

  temporal_conv_kernel_size: 4
  temporal_conv_stride: 4
  vocab_size: 4096
  vae_dim: 32
  num_resolutions: 10

  resize_imgs_with_padding: "(224, 224)"
  attention_implementation: eager
