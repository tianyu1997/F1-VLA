# Teacher-Student Distillation Training Configuration
# 
# Teacher: Full observation (head + wrist camera) - frozen
# Student: Wrist camera only - trainable (gen expert only)
# 
# Loss = GT_loss + memory_loss_weight * Memory_distillation_loss

dataset:
  # Use ME_KVM data format - CLEAN ONLY (match teacher training)
  use_mekvm_format: True
  mekvm_data_dirs:
    - /mnt/data2/ty/F1-VLA/ME_KVM_VLA/data/clean
  mekvm_task_descriptions:
    - "在干净环境中,探索环境,根据动作和状态预测下一帧观测。"
  mekvm_weights:
    - 1.0
  n_obs_img_steps: 4
  n_pred_img_steps: 1
  chunk_size: 4

  image_size:
    height: 224
    width: 224
  world_model_suffix: history
  
  # Normalization stats loaded from f1_vla/config/dataset_stats.yaml
  
  transforms:
    consistent_random_crop_stages:
      - stage1_pretrain_wm

exp:
  stage: stage_teacher_student
  
  # Teacher checkpoint (trained world model with memory)
  teacher_ckpt: /mnt/data2/ty/F1-VLA/outputs/memory_wm_clean_only/checkpoint-episode-286272
  
  # Student checkpoint (optional, if None will copy from teacher)
  # Set this to resume student training or use a different initialization
  student_ckpt: /mnt/data2/ty/F1-VLA/outputs/memory_wm_clean_only/checkpoint-episode-286272
  
  # Memory configuration - ENABLED
  # Memory configuration for STUDENT
  # NOTE: Teacher checkpoint was trained WITHOUT memory (use_memory: False in saved config)
  # So we disable memory for teacher and only enable for student learning
  use_memory: True  # Enable memory for both teacher and student
  memory_config:
    memory_len: 32        # Full memory length for distillation
    bptt_steps: 4        # Match teacher BPTT steps
    init_std: 0.02       # Memory initialization std
    tokenizer_max_length: 512
  
  # Teacher-Student specific config
  teacher_student_config:
    use_teacher_student: False  # Standard mode (both on same GPU) - OOM prone
    use_student_only: False     # Control group (no teacher)
    use_split_gpu: True         # NEW: Teacher and Student on separate GPUs (recommended)
    
    # Device assignment for split_gpu mode
    # NOTE: These are indices within CUDA_VISIBLE_DEVICES, not absolute GPU IDs
    # If you run with -g 5,6 then cuda:0=GPU5, cuda:1=GPU6
    teacher_device: "cuda:0"    # First visible GPU (teacher)
    student_device: "cuda:1"    # Second visible GPU (student)
    
    # Memory distillation config
    # ENABLED: Memory distillation from teacher to student
    memory_loss_weight: 0.1     # Enabled - weight for memory distillation loss
    use_memory_distillation: True  # Enabled - distill memory from teacher to student

  training_args:
    output_dir: outputs/teacher_student_wm
    run_name: teacher_student_split_gpu
    do_train: True
    do_eval: False
    num_train_epochs: 100
    per_device_train_batch_size: 1  # Reduced from 2 to 1 to save memory
    per_device_eval_batch_size: 1

    learning_rate: !!float 3e-5    # Reduced for stability (match v5)
    weight_decay: !!float 1e-4     # Increased regularization (match v5)
    adam_beta1: 0.9
    adam_beta2: 0.999              # Better for Transformers (match v5)
    adam_epsilon: !!float 1e-8
    optim: adamw_bnb_8bit          # 8-bit optimizer saves ~50% memory
    lr_scheduler_type: cosine
    gradient_accumulation_steps: 8  # Increased from 4 to 8 to maintain effective batch size of 8
    gradient_checkpointing: False    # Model doesn't support this
    max_grad_norm: 1.0              # Gradient clipping to prevent NaN

    max_steps: 180000              # Half of v5 (360k) for student training
    warmup_steps: 2000             # Longer warmup (match v5)
    log_level: info
    log_level_replica: error

    seed: 42
    bf16: True
    logging_strategy: "no"
    logging_steps: 999999
    save_strategy: "no"
    save_steps: 999999
    eval_strategy: "no"
    save_safetensors: True
    disable_tqdm: True

    save_total_limit: 3
    overwrite_output_dir: True
    dataloader_num_workers: 4
    dataloader_pin_memory: False
    dataloader_persistent_workers: True
    dataloader_prefetch_factor: 4
    remove_unused_columns: False

    # Episode-based logging/saving/eval
    logging_episodes: 10
    save_episodes: 500
    eval_episodes: 500

    label_names: 
      - action
    report_to: 
      - tensorboard

    torch_compile: False
    stage: stage_teacher_student

    # World Model Only Training (student trains gen expert)
    gen_out_loss_ratio: 1.0
    freeze_vision_encoder: True
    freeze_gen_expert: False
    train_act_expert_only: False
    train_gen_expert_only: True
    train_state_proj: True

    image_transforms_enabled: True
    image_transforms_type:
      - brightness
      - contrast
      - saturation
      - random_crop
    image_transforms_max_num_transforms: 3
    image_transforms_random_order: True

    und_expert_lr: !!float 5e-5
    act_expert_lr: !!float 0
    vision_encoder_lr: !!float 0
    gen_expert_lr: !!float 5e-5

  max_eval_samples: 1000
  
  # Camera configuration
  camera_config:
    und_camera_keys:
      - head_rgb
      - wrist_rgb
    wm_camera_key: wrist_rgb

policy:
  model_name: f1_teacher_student
  path: /mnt/data2/ty/F1-VLA/F1_pretrain/pi0
  ckpt_path: f1_vla/config/f1_config.json
  language_tokenizer_path: /mnt/data2/ty/F1-VLA/F1_pretrain/paligemma-3b-pt-224
  mwm_pretrained_path: null
  chunk_size: 4

  use_world_model: True
  pn: "1_2_3_4_5_6_8_10_13_16"
  vae_ckpt: /mnt/data2/ty/F1-VLA/var/vae_ch160v4096z32.pth

  temporal_conv_kernel_size: 4
  temporal_conv_stride: 4
  vocab_size: 4096
  vae_dim: 32
  num_resolutions: 10

  resize_imgs_with_padding: "(224, 224)"
  attention_implementation: eager
