dataset:
  # Use ME_KVM data format - MINI TEST (10 episodes)
  use_mekvm_format: True
  mekvm_data_dirs:
    - /tmp/test_data_mini
  mekvm_task_descriptions:
    - "在干净环境中,探索环境,根据动作和状态预测下一帧观测。"
  mekvm_weights:
    - 1.0
  n_obs_img_steps: 4
  n_pred_img_steps: 1
  chunk_size: 4

  # Legacy LeRobot config (not used when use_mekvm_format=True)
  train_dir: {}

  image_size:
    height: 224
    width: 224
  world_model_suffix: history
  transforms:
    consistent_random_crop_stages:
      - stage1_pretrain_wm

exp:
  stage: stage1_pretrain_wm
  # Load pretrained weights from F1_pretrain (fresh start with memory fix)
  load_ckpt: /mnt/data2/ty/F1-VLA/F1_pretrain
  
  # Memory configuration - ENABLED
  use_memory: True
  memory_config:
    memory_len: 16      # Number of memory slots per layer (reduced for memory efficiency)
    bptt_steps: 4       # BPTT truncation length
    tokenizer_max_length: 512

  training_args:
    output_dir: outputs/test_epoch_fix
    run_name: test_epoch_fix
    # Start fresh training (not resume) - just load weights via load_ckpt above
    # resume_from_checkpoint: null
    do_train: True
    do_eval: False
    # Use max_steps instead of num_train_epochs to avoid epoch boundary issues
    # 240 eps × 40 frames × 100 epochs / (batch_size=2 × grad_accum=2) ≈ 240,000 steps
    num_train_epochs: 1000  # Set very high, max_steps controls actual training
    per_device_train_batch_size: 2
    per_device_eval_batch_size: 1
    gradient_accumulation_steps: 2

    learning_rate: !!float 1e-4
    weight_decay: !!float 1e-10
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_epsilon: !!float 1e-8
    lr_scheduler_type: cosine

    # Use max_steps to control training (avoids epoch boundary sync issues)
    max_steps: 2000
    warmup_steps: 200
    log_level: info
    log_level_replica: error

    seed: 42
    bf16: True
    # Disable step-based logging/saving (use episode-based instead)
    logging_strategy: "no"
    logging_steps: 999999
    save_strategy: "no"
    save_steps: 999999
    eval_strategy: "no"
    save_safetensors: True
    disable_tqdm: True

    save_total_limit: 3
    overwrite_output_dir: True
    dataloader_num_workers: 2
    dataloader_pin_memory: False
    dataloader_persistent_workers: True
    dataloader_prefetch_factor: 4
    remove_unused_columns: False

    # Episode-based logging/saving/eval
    logging_episodes: 10
    save_episodes: 500
    eval_episodes: 0

    label_names: 
      - action
    report_to: 
      - tensorboard

    torch_compile: False
    stage: stage1_pretrain_wm

    # World Model Only Training
    gen_out_loss_ratio: 1.0
    freeze_vision_encoder: True
    freeze_gen_expert: False
    train_act_expert_only: False
    train_gen_expert_only: True
    train_state_proj: True

    image_transforms_enabled: True
    image_transforms_type:
      - brightness
      - contrast
      - saturation
      - random_crop
    image_transforms_max_num_transforms: 3
    image_transforms_random_order: True

    und_expert_lr: !!float 1e-4
    act_expert_lr: !!float 0
    vision_encoder_lr: !!float 0
    gen_expert_lr: !!float 1e-4

  max_eval_samples: 1000
  
  camera_config:
    und_camera_keys:
      - head_rgb
      - wrist_rgb
    wm_camera_key: wrist_rgb

policy:
  model_name: f1
  path: /mnt/data2/ty/F1-VLA/pi0
  ckpt_path: f1_vla/config/f1_config.json
  language_tokenizer_path: /mnt/data2/ty/F1-VLA/paligemma-3b-pt-224
  mwm_pretrained_path: null
  chunk_size: 4

  use_world_model: True
  pn: "1_2_3_4_5_6_8_10_13_16"
  vae_ckpt: /mnt/data2/ty/F1-VLA/var/vae_ch160v4096z32.pth

  # Episode-internal loss warmup: reduce loss weight for early frames
  # Memory is inaccurate at episode start, so early frame predictions should contribute less
  loss_warmup_frames: 8       # Linear warmup over first 8 frames
  loss_warmup_min_weight: 0.1 # Weight for frame 0 (increases linearly to 1.0)

  temporal_conv_kernel_size: 4
  temporal_conv_stride: 4
  vocab_size: 4096
  vae_dim: 32
  num_resolutions: 10

  resize_imgs_with_padding: "(224, 224)"
  attention_implementation: eager
